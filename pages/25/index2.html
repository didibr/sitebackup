<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="google" value="notranslate">
  <title>Mame</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <div id="loadingScreen">
    <div class="loader"></div>
    <div id="loadingText">Loading...</div>
  </div>

  <div id="main">
  </div>
  <div id="game">
  </div>






  <script type="module">
    import * as THREE from 'https://didisoftwares.ddns.net/25/three/three.module.js';
    window.THREE = THREE;
    import { GLTFLoader, DRACOLoader } from 'https://didisoftwares.ddns.net/25/three/gltfloader.js';



    let SCREEN_WIDTH = window.innerWidth;
    let SCREEN_HEIGHT = window.innerHeight;
    let aspect = SCREEN_WIDTH / SCREEN_HEIGHT;
    let controls, camera, container, ambient, scene, renderElement, renderer;
    let parts = {};
    let running = true;

    let tvTexture;
    let copyCanvas;
    let copyCtx;
    let emulatorCanvas;


    window.EJS_player = "#game";
    window.EJS_core = "mame2003";
    window.EJS_color = "#000000";
    window.EJS_startOnLoaded = true;
    window.EJS_pathtodata =
      "https://didisoftwares.ddns.net/25/emulator/";
    window.EJS_gameUrl =
      "https://didisoftwares.ddns.net/25/emulator/astyanax.zip";

    const script = document.createElement("script");
    script.src =
      "https://didisoftwares.ddns.net/25/emulator/loader.js";

    window.EJS_onGameStart = function () {
      hideLoading();
      createscreen();
    }


    const ground = 0;
    const hdrloader = new THREE.HDRLoader();
    const glbloader = new GLTFLoader();
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://didisoftwares.ddns.net/draco/');
    glbloader.setDRACOLoader(dracoLoader);

    glbloader.setCrossOrigin('anonymous');
    dracoLoader.setCrossOrigin('anonymous');
    hdrloader.setCrossOrigin('anonymous');

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    //****** update
    let timer;
    let accumulator = 0;
    let lastTime = 0;
    const maxFPS = 30;
    const fixedTimeStep = 1 / maxFPS;

    renderElement = document.getElementById('main');

    function showLoading() {
      const loading = document.getElementById("loadingScreen");
      if (!loading) return;
      loading.style.display = "flex";
      loading.style.opacity = "1";
    }

    function hideLoading() {
      const loading = document.getElementById("loadingScreen");
      if (!loading) return;
      loading.style.opacity = "0";
      setTimeout(() => {
        loading.style.display = "none";
      }, 500);
    }

    async function init() {
      loadGame();
      scene = new THREE.Scene();
      container = document.createElement('div');
      if (!renderElement) {
        document.body.appendChild(container);
        SCREEN_WIDTH = window.innerWidth;
        SCREEN_HEIGHT = window.innerHeight;
        aspect = SCREEN_WIDTH / SCREEN_HEIGHT;
      } else {
        renderElement.appendChild(container);
        const rect = renderElement.getBoundingClientRect();
        SCREEN_WIDTH = rect.width;
        SCREEN_HEIGHT = rect.height;
        aspect = rect.width / rect.height;
      }
      timer = new THREE.Timer();
      camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 2000);
      camera.position.set(0, ground, -5);
      scene.add(camera);
      try {
        renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: false /*, powerPreference: "low-power"*/
        });
      } catch (e) { console.error("Fail to create WebGL"); return; }
      renderer.setPixelRatio(1);
      renderer.setSize(SCREEN_WIDTH, SCREEN_HEIGHT);
      renderer.setAnimationLoop(update);
      container.appendChild(renderer.domElement);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NeutralToneMapping;//THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1;
      renderer.autoClear = false;
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.y += ground + 0.3;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 5;
      controls.enableRotate = true;
      controls.enableZoom = true;
      controls.enablePan = false;
      controls.maxDistance = 1.95;
      controls.minDistance = 0.7;
      window.CF = camera;

      controls.addEventListener('start', () => {
        controls.autoRotate = false;
      });
      window.addEventListener('resize', onWindowResize);
      createScene();
      window.addEventListener("pointerdown", onPointerDown);
      window.addEventListener("keydown", btPress);
      window.addEventListener("keyup", btRelease);
    }



    const tilt = 0.2;
    function btPress(e) {
      if (!e.isTrusted) return;
      if (["KeyZ", "KeyX", "KeyS",
        "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"
      ].includes(e.code)) {
        emulatorCanvas.dispatchEvent(
          new KeyboardEvent("keydown", {
            key: e.key,
            code: e.code,
            keyCode: e.keyCode,
            which: e.which,
            bubbles: true
          })
        );
      }
      switch (e.code) {
        case "KeyX":
          parts.bt04.position.y = -0.005;
          break;
        case "KeyZ":
          parts.bt03.position.y = -0.005;
          break;
        case "KeyS":
          parts.bt05.position.y = -0.005;
          break;
        case "ArrowUp":
          parts.joy.rotation.z = tilt;
          break;
        case "ArrowDown":
          parts.joy.rotation.z = -tilt;
          break;
        case "ArrowLeft":
          parts.joy.rotation.x = tilt;
          break;
        case "ArrowRight":
          parts.joy.rotation.x = -tilt;
          break;
      }
    };

    function btRelease(e) {
      if (!e.isTrusted) return;
      if (["KeyZ", "KeyX", "KeyS",
        "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"
      ].includes(e.code)) {
        emulatorCanvas.dispatchEvent(
          new KeyboardEvent("keyup", {
            key: e.key,
            code: e.code,
            keyCode: e.keyCode,
            which: e.which,
            bubbles: true
          })
        );
      }
      switch (e.code) {
        case "KeyX":
          parts.bt04.position.y = 0;
          break;

        case "KeyZ":
          parts.bt03.position.y = 0;
          break;
        case "KeyS":
          parts.bt05.position.y = 0;
          break;
        case "ArrowUp":
        case "ArrowDown":
          parts.joy.rotation.z = 0;
          break;
        case "ArrowLeft":
        case "ArrowRight":
          parts.joy.rotation.x = 0;
          break;
      }
    };

    function tapKey(keyName) {
      const map = {
        V: {
          key: "v",
          code: "KeyV",
          keyCode: 86,
          which: 86
        },
        EN: {
          key: "Enter",
          code: "Enter",
          keyCode: 13,
          which: 13
        }
      };

      const k = map[keyName];
      if (!k) return;

      // aperta
      emulatorCanvas.dispatchEvent(
        new KeyboardEvent("keydown", {
          key: k.key,
          code: k.code,
          keyCode: k.keyCode,
          which: k.which,
          bubbles: true
        })
      );

      // solta após 50ms
      setTimeout(() => {
        emulatorCanvas.dispatchEvent(
          new KeyboardEvent("keyup", {
            key: k.key,
            code: k.code,
            keyCode: k.keyCode,
            which: k.which,
            bubbles: true
          })
        );
      }, 50);
    }

    function onWindowResize() {
      if (!renderElement) {
        SCREEN_WIDTH = window.innerWidth;
        SCREEN_HEIGHT = window.innerHeight;
        aspect = SCREEN_WIDTH / SCREEN_HEIGHT;
      } else {
        const rect = renderElement.getBoundingClientRect();
        SCREEN_WIDTH = rect.width;
        SCREEN_HEIGHT = rect.height;
        aspect = rect.width / rect.height;
      }
      camera.aspect = SCREEN_WIDTH / SCREEN_HEIGHT;
      camera.updateProjectionMatrix();
      renderer.setSize(SCREEN_WIDTH, SCREEN_HEIGHT);
    }

    function update() {
      timer.update();
      let delta = timer.getDelta();
      if (delta > 0.1) delta = 0.1;
      accumulator += delta;
      while (accumulator >= fixedTimeStep) {
        accumulator -= fixedTimeStep;
      }
      if (parts && parts.window && parts.window.material && parts.window.material.map) {
        updateScreen();
      }
      controls.update();
      renderer.render(scene, camera);
    }


    function onPointerDown(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(scene.children, true);
      if (!hits.length) return;
      const hit = hits[0].object;
      //console.log(hit);
      if (hit.name) {
        console.log(hit.name);
        if (hit.name === "bt01") {
          tapKey("V");
        }
        if (hit.name === "bt02") {
          tapKey("EN");
        }
      }
    }



    function isBlackFrame(ctx, width, height) { //Canvas in clear mode
      const points = [
        [0.25, 0.25],
        [0.50, 0.25],
        [0.75, 0.25],


      ];
      for (const [ux, uy] of points) {
        const x = Math.floor(width * ux);
        const y = Math.floor(height * uy);
        const pixel = ctx.getImageData(x, y, 1, 1).data;
        if (pixel[3] !== 0) {
          return false;
        }
      }
      return true;
    }

    function updateScreen() {
      if (!emulatorCanvas || !copyCtx || !tvTexture) { return; }
      try {
        copyCtx.drawImage(emulatorCanvas, 0, 0);
        const blackFrame = isBlackFrame(
          copyCtx,
          copyCanvas.width,
          copyCanvas.height
        );
        if (!blackFrame) {
          tvTexture.needsUpdate = true;
        }
      } catch (e) {
        console.warn('Falha ao copiar frame', e);
      }
    }

    function createscreen() {
      const uv = parts.window.geometry.attributes.uv;
      let minU = Infinity;
      let maxU = -Infinity;
      let minV = Infinity;
      let maxV = -Infinity;
      for (let i = 0; i < uv.count; i++) {
        const u = uv.getX(i);
        const v = uv.getY(i);
        minU = Math.min(minU, u);
        maxU = Math.max(maxU, u);
        minV = Math.min(minV, v);
        maxV = Math.max(maxV, v);
      }
      for (let i = 0; i < uv.count; i++) {
        const u = uv.getX(i);
        const v = uv.getY(i);
        uv.setXY(
          i,
          (u - minU) / (maxU - minU),
          (v - minV) / (maxV - minV)
        );
      }
      uv.needsUpdate = true;

      emulatorCanvas = document.querySelector('.ejs_canvas');
      copyCanvas = document.createElement('canvas');
      copyCanvas.width = emulatorCanvas.width;
      copyCanvas.height = emulatorCanvas.height;
      copyCtx = copyCanvas.getContext('2d', {
        willReadFrequently: true
      });
      const texture = new THREE.CanvasTexture(copyCanvas);
      texture.flipY = true;
      texture.colorSpace = THREE.NoColorSpace;
      texture.generateMipmaps = false;
      texture.minFilter = THREE.NearestFilter;
      texture.magFilter = THREE.NearestFilter;
      tvTexture = texture;
      parts.window.material = new THREE.MeshPhysicalMaterial({
        map: texture,
        roughness: 0.15,
        metalness: 0.0,
        envMapIntensity: 1.0
      });
    }

    async function createScene() {
      ambient = new THREE.AmbientLight(0xffffff, 0.2);
      scene.add(ambient);
      const keyLight = new THREE.DirectionalLight(0xffffff, 2);
      keyLight.position.set(3, 5, 4);
      scene.add(keyLight);
      hdrloader.load("https://didisoftwares.ddns.net/25/gro.hdr", (texture) => {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        scene.environment = texture;
        scene.environmentIntensity = 0.4;
        const skybox = new THREE.GroundedSkybox(texture, 1.4, 4);
        skybox.position.y = 0.4;
        scene.add(skybox);
        window.SX = skybox;
      });

      const blackbuttonMat = new THREE.MeshPhysicalMaterial({
        color: 0x000000,
        roughness: 0.15,
        metalness: 0.0,
        envMapIntensity: 1.0
      });

      glbloader.load("https://didisoftwares.ddns.net/25/box.glb", (model) => {
        model.scene.traverse(obj => {
          if (obj.isMesh) parts[obj.name] = obj;
        });
        for (var i = 1; i < 7; i++) {
          parts[`btn${i}`].position.y = -0.005;
        }
        for (var i = 1; i < 9; i++) {
          parts[`btn${i}`].material = blackbuttonMat;
        }
        window.PP = parts;
        const object = model.scene.children[0];
        object.position.set(0, 0, 0);
        scene.add(object);
        parts.window.material = new THREE.MeshPhysicalMaterial({ color: 0x000000 });
      });
    }

    //**************************
    //**** GAME PART
    //**************************

    function waitAndMoveCanvas() {
      return new Promise((resolve) => {
        function check() {
          const game = document.getElementById('game');
          const canvas = document.querySelector('.ejs_canvas');
          if (!game || !canvas) return;
          game.innerHTML = '';
          game.appendChild(canvas);
          game.style.display = "none";
          resolve(canvas);
          return true;
        }
        if (check()) return;
        const observer = new MutationObserver(() => {
          if (check()) { observer.disconnect(); }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      });
    }

    async function loadGame() {
      //V -> credits -> Enter = Start -> Z = Jump -> x = att -> s = especial
      document.body.appendChild(script);
      await waitAndMoveCanvas();
    }

    showLoading();
    init();


  </script>





</body>

</html>
