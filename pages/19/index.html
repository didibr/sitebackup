<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>News</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        @import url(https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap);*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif;-webkit-tap-highlight-color:#fff0}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;height:100vh;background:radial-gradient(circle at 15% 20%,rgb(116 34 255 / .18),transparent 32%),radial-gradient(circle at 82% 18%,rgb(0 174 255 / .14),transparent 34%),radial-gradient(circle at 50% 100%,rgb(0 89 255 / .18),transparent 42%),linear-gradient(145deg,#060816,#0b1329,#101b37 70%);overflow:hidden;position:relative}body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgb(255 255 255 / .015) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255 / .015) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(circle at center,#000 30%,transparent 100%);pointer-events:none;opacity:.4}.topbar{position:fixed;top:0;left:0;width:100%;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:linear-gradient(to bottom,rgb(7 10 18 / .88),rgb(7 10 18 / .62));backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid rgb(255 255 255 / .06);box-shadow:0 10px 40px rgb(0 0 0 / .28);z-index:100}.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:.6px;color:#fff;text-shadow:0 0 18px rgb(255 255 255 / .12)}.logo-dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#2563eb);box-shadow:0 0 18px #2563eb,0 0 38px rgb(37 99 235 / .45)}.topbar nav{display:flex;align-items:center;gap:22px}.topbar nav a{position:relative;color:rgb(255 255 255 / .78);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.3px;transition:.22s}.topbar nav a:hover{color:#fff;text-shadow:0 0 14px rgb(255 255 255 / .3)}.topbar nav a:after{content:"";position:absolute;left:0;bottom:-6px;width:0;height:2px;border-radius:999px;background:linear-gradient(90deg,#60a5fa,#2563eb);transition:.25s}.topbar nav a:hover:after{width:100%}.searchbox{display:flex;align-items:center;width:min(42vw, 520px);height:46px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,rgb(255 255 255 / .08),rgb(255 255 255 / .03));border:1px solid rgb(255 255 255 / .08);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgb(255 255 255 / .05),0 6px 18px rgb(0 0 0 / .22);transition:.25s}.searchbox:focus-within{border-color:rgb(96 165 250 / .45);box-shadow:0 0 0 3px rgb(37 99 235 / .18),0 8px 28px rgb(0 0 0 / .35)}.searchbox input{flex:1;height:100%;border:none;outline:none;background:#fff0;padding:0 18px;font-size:14px;color:#fff}.searchbox input::placeholder{color:rgb(255 255 255 / .4)}.searchbtn{width:54px;height:100%;border:none;background:linear-gradient(135deg,#2563eb,#3b82f6);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.25s;box-shadow:-1px 0 0 rgb(255 255 255 / .05)}.searchbtn:hover{filter:brightness(1.08)}.searchbtn:active{transform:scale(.97)}.searchbtn svg{width:19px;height:19px;color:#fff;filter:drop-shadow(0 0 6px rgb(255 255 255 / .25))}#menu{width:100%;height:100vh;padding-top:64px;display:flex;align-items:center;justify-content:center;overflow:hidden}.swiper{width:100%;height:100%;padding:22px}.swiper-wrapper{align-items:center}.swiper-slide{display:flex;align-items:center;justify-content:center;height:auto}.card{width:min(88vw, 360px);height:75vh;border-radius:30px;overflow:hidden;position:relative;background:#111827;box-shadow:0 18px 50px rgb(0 0 0 / .45),0 0 0 1px rgb(255 255 255 / .04),inset 0 1px 0 rgb(255 255 255 / .06);border:1px solid rgb(255 255 255 / .06);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s ease}.card:hover{transform:translateY(-10px) scale(1.015);box-shadow:0 28px 70px rgb(0 0 0 / .62),0 0 40px rgb(37 99 235 / .18)}.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;filter:brightness(.72);transition:transform 1.2s ease,filter .5s ease}.card:hover img{transform:scale(1.05);filter:brightness(.82) saturate(1.08) contrast(1.04)}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgb(0 0 0 / .97) 4%,rgb(0 0 0 / .72) 32%,rgb(0 0 0 / .18) 60%,transparent 82%);z-index:1}.card:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgb(96 165 250 / .08),transparent 45%,rgb(255 255 255 / .03));mix-blend-mode:screen;pointer-events:none;z-index:1}.info{position:absolute;left:0;bottom:0;width:100%;padding:24px;z-index:2;color:#fff;display:flex;flex-direction:column;gap:14px}.info h2{font-size:23px;font-weight:800;line-height:1.08;margin-bottom:2px;text-shadow:0 4px 22px rgb(0 0 0 / .9);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.info p{font-size:14px;line-height:1.48;opacity:.92;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;color:rgb(255 255 255 / .88);text-shadow:0 2px 12px rgb(0 0 0 / .85)}.readmore{height:46px;border:none;border-radius:16px;background:linear-gradient(135deg,#2563eb,#3b82f6 55%,#60a5fa);color:#fff;font-size:13px;font-weight:800;letter-spacing:.3px;cursor:pointer;transition:.28s;box-shadow:0 10px 26px rgb(37 99 235 / .34),inset 0 1px 0 rgb(255 255 255 / .15)}.readmore:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgb(37 99 235 / .45),0 0 20px rgb(96 165 250 / .28)}.readmore:active{transform:scale(.98)}.swiper-button-prev,.swiper-button-next{color:#fff!important;width:52px!important;height:52px!important;background:rgb(10 14 24 / .58);backdrop-filter:blur(16px) saturate(180%);border-radius:50%;border:1px solid rgb(255 255 255 / .08);box-shadow:0 10px 26px rgb(0 0 0 / .35);transition:.25s}.swiper-button-prev:hover,.swiper-button-next:hover{transform:scale(1.08);background:rgb(37 99 235 / .65);box-shadow:0 0 24px rgb(37 99 235 / .35)}.swiper-button-prev:after,.swiper-button-next:after{font-size:18px!important;font-weight:900}#newsLoading{position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgb(18 24 42 / .58),rgb(4 6 12 / .88));backdrop-filter:blur(18px) saturate(140%);animation:.25s fadeIn}.news-loading-box{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;padding:34px 38px;border-radius:30px;background:linear-gradient(180deg,rgb(20 26 42 / .95),rgb(13 18 32 / .92));border:1px solid rgb(255 255 255 / .08);box-shadow:0 20px 80px rgb(0 0 0 / .55),0 0 40px rgb(37 99 235 / .18),inset 0 1px 0 rgb(255 255 255 / .06);overflow:hidden}.news-loading-box:before{content:"";position:absolute;inset:-1px;background:linear-gradient(135deg,rgb(96 165 250 / .22),transparent 30%,transparent 70%,rgb(96 165 250 / .18));opacity:.8;pointer-events:none}.news-spinner{width:62px;height:62px;border-radius:50%;border:4px solid rgb(255 255 255 / .08);border-top-color:#60a5fa;border-right-color:#2563eb;box-shadow:0 0 30px rgb(37 99 235 / .25);animation:spin .75s linear infinite}.news-loading-text{font-size:15px;font-weight:800;letter-spacing:.7px;color:#fff;text-shadow:0 0 16px rgb(255 255 255 / .18);opacity:.95}@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
        
        .mini-trigger{
position:fixed;
top:0;
left:50%;
transform:translateX(-50%);
width:120px;
height:12px;
border-radius:0 0 14px 14px;
z-index:1001;
background:linear-gradient(180deg,rgb(255 255 255 /.18),rgb(255 255 255 /.04));
backdrop-filter:blur(12px);
border:1px solid rgb(255 255 255 /.08);
border-top:none;
box-shadow:0 6px 18px rgb(0 0 0 /.35);
opacity:.7;
transition:.25s
}

.mini-trigger:hover{
opacity:1;
height:16px
}

.mini-search{
position:fixed;
top:-70px;
left:50%;
transform:translateX(-50%);
z-index:1000;
display:flex;
align-items:center;
width:min(92vw,420px);
height:48px;
border-radius:0 0 22px 22px;
overflow:hidden;
transition:.28s cubic-bezier(.2,.8,.2,1);
background:rgb(10 14 24 /.88);
backdrop-filter:blur(18px) saturate(180%);
border:1px solid rgb(255 255 255 /.08);
border-top:none;
box-shadow:0 14px 34px rgb(0 0 0 /.5)
}

.mini-search input{
flex:1;
height:100%;
border:none;
outline:none;
background:#fff0;
padding:0 16px;
font-size:14px;
color:#fff
}

.mini-search input::placeholder{
color:rgb(255 255 255 /.42)
}

.mini-search button{
width:54px;
height:100%;
border:none;
background:linear-gradient(135deg,#2563eb,#3b82f6);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer
}

.mini-search svg{
width:18px;
height:18px;
color:#fff
}

@media(max-height:376px){

.topbar{
display:none!important
}

#menu{
padding-top:0!important
}

.swiper{
padding:0!important
}

.card{
width:min(96vw,420px);
height:96vh;
border-radius:18px
}

.swiper-button-prev,
.swiper-button-next{
display:none!important
}

.mini-trigger:hover+.mini-search,
.mini-search:hover,
.mini-search:focus-within{
top:0
}

}

        @media(max-width:1300px){.card{height:72vh}}
        @media(max-width:1000px){.card{height:68vh}.swiper{padding:16px}}
        @media(max-width:700px){.topbar{padding:0 12px}.topbar nav{display:none}.searchbox{width:100%;height:42px}.logo{font-size:17px}.card{width:min(92vw, 340px);height:70vh;border-radius:26px}.info{padding:18px}.info h2{font-size:20px}.info p{font-size:13px}.swiper-button-prev,.swiper-button-next{display:none!important}}
        @media(max-height:376px){.readmore{height:30px;font-size:12px}.info{gap:8px;padding:14px}.info p{line-height:1.12}}.news-date{position:absolute;bottom:0;right:0;z-index:2;padding:4px 12px;border-radius:21px 0 0 0;background:rgb(0 0 0 / .45);backdrop-filter:blur(10px);border:1px solid rgb(255 255 255 / .08);font-size:xx-small;font-weight:700;color:#fff;line-height:1;box-shadow:0 4px 12px rgb(0 0 0 / 25%)}
        @media(max-height:376px){.readmore{height:30px}.info p{line-height:1.1}}
    </style>
</head>

<body>

<div class="mini-trigger"></div>
<div class="mini-search" id="miniSearch">
<input id="miniInput" type="text" placeholder="Search news..." onkeydown="if(event.key==='Enter')getNews(this.value)">
<button onclick="getNews(document.querySelector('.mini-search input').value)">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="11" cy="11" r="7"></circle>
<line x1="16.65" y1="16.65" x2="21" y2="21"></line>
</svg>
</button>
</div>

    <header class="topbar">

        <div class="logo">
            <span class="logo-dot"></span>
            DNews
        </div>

        <div class="searchbox">

            <input type="text" id="topic" placeholder="Search news..." onkeydown="if(event.key==='Enter')getNews()">

            <button onclick="getNews()" class="searchbtn">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.65" y1="16.65" x2="21" y2="21"></line>
                </svg>

            </button>

        </div>

        <nav>
            <a href="#" onclick="getNews('world');">World</a>
            <a href="#" onclick="getNews('Politics');">Politics</a>
            <a href="#" onclick="getNews('Technology');">Technology</a>
            <a href="#" onclick="getNews('Business');">Business</a>
        </nav>

    </header>

    <section id="menu">

        <div class="swiper mySwiper">

            <div class="swiper-wrapper" id="slider"></div>

            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>

        </div>

    </section>



</body>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="./index.js"></script>
</body>

</html>
