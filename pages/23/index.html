					<div class="d-flex align-items-center w-auto mb-3">
						<button value="load" class="bModel btn btn-info mt-1" onClick="loadModel('minimal');">Minimal</button>

				<button value="start" id="btStart" disabled="true" class="btn btn-info mt-1" onClick="startListen();">Start</button>
				<button value="stop" id="btStop" disabled="true" class="btn btn-info mt-1" onClick="stopListen();">Stop</button>
				<button value="clear" class="btn btn-danger mt-1" onClick="JAVASCRIPT:COMMAND.clearCache()">Clear Cache</button>
			</div>

			<div id="vstatus">Status</div>

			<div class="my-1">
				<div class="d-flex align-items-center flex-wrap" style="gap: 5px;">
					<textarea id="textarea" rows="2" cols="50" class="form-control py-1 my-0"></textarea>
				</div>
			</div>

                    Loading...
        	</div>

	<script src="../translation.js"></script>
	<script type="text/javascript" src="./whisper.js"></script>
	<script>
		var textarea = document.getElementById('textarea');
		var vstatus = document.getElementById('vstatus');
		var btStart = document.getElementById('btStart');
		var btStop = document.getElementById('btStop');

		window.addEventListener("load", async () => {
			window.COMMAND = await Whisper.create();
		});

		function onListen(text) {
			textarea.value = text;
		}

		function onStatusChange(text) {
			vstatus.innerText = text;
		}

		async function loadModel(name) {
			if (typeof (COMMAND) === "undefined") return;
			document.querySelectorAll(".bModel").forEach(button => {
				button.disabled = true;
			});
			const language = document.getElementById("language").value;
			var modelName=name;
			if(language==="en"){
				modelName+=".en";
			}
			await COMMAND.loadWhisper(modelName, language);
			if (COMMAND.modelLoaded) {
				btStart.disabled = false;
			}
		}

		function startListen() {
			btStart.disabled = true;
			btStop.disabled = false;
			COMMAND.start(onListen, onStatusChange);
		}

		function stopListen() {
			btStart.disabled = false;
			btStop.disabled = true;
			COMMAND.stop();
		}

		

	</script>
