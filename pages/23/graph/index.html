<!DOCTYPE html>
<html lang="en">

<head>
	<title>DidiSoftwares</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<meta name="google" value="notranslate">
	<title>Graph</title>
	<style>
		:root {
			--bg: #0d1117;
			--panel: #161b22;
			--border: #30363d;
			--text: #e6edf3;
			--accent: #58a6ff
		}

		* {
			box-sizing: border-box
		}

		html,
		body {
			width: 100%;
			height: 80%;
			margin: 0
		}

		body {
			padding: 0px;
			background: var(--bg);
			color: var(--text);
			font: 13px Segoe UI, sans-serif;
			display: grid;
			grid-template-rows: auto 40% 70%;
			gap: 2px;
			height: 100vh;
			overflow: hidden
		}

		.toolbar {
			display: flex;
			gap: 4px;
			flex-wrap: wrap
		}

		.select {
			padding: 4px 8px;
			background: var(--panel);
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: 6px;
			outline: none
		}
    .select{
      color: #ffd700;
    }

		.textarea,
		.output {
			width: 100%;
			height: 100%;
			min-height: 0;
			padding: 6px;
			border: 1px solid var(--border);
			border-radius: 6px;
			font: 12px Consolas, monospace
		}

		.textarea {
			background: var(--panel);
			color: var(--text);
			resize: none;
			outline: none
		}

		.output {
			margin: 0;
			background: #010409;
			color: #7ee787;
			overflow: scroll;
			min-height:0;      
		}

		.select:focus,
		.textarea:focus {
			border-color: var(--accent)
		}

		.output::-webkit-scrollbar {
			width: 8px;
			height: 8px
		}

		.output::-webkit-scrollbar-thumb {
			background: #30363d;
			border-radius: 99px
		}

		@media(max-height:350px) {
			body {
				padding: 2px;
				gap: 2px;
				grid-template-rows: auto 58% 42%
			}

			.select {
				padding: 2px 4px;
				font-size: 11px
			}

			.textarea,
			.output {
				padding: 4px;
				font-size: 10px
			}
		}

		@media(max-height:260px) {
			body {
				grid-template-rows: auto 1fr;
				grid-template-columns: 1fr 1fr
			}

			.toolbar {
				grid-column: 1/3
			}

			.textarea {
				grid-column: 1
			}

			.output {
				grid-column: 2
			}
		}
	</style>
</head>

<body>

	<body>
  <div class="toolbar">

		<select class="select" id="examples">
			<option selected disabled>Examples</option>
		</select>

      Render Mode:
		<select class="select" id="output-format">
			<option value="ascii" selected>ascii</option>
			<option value="boxart">boxart</option>
			<option value="txt">txt</option>
			<option value="graphviz">graphviz</option>
		</select>

	</div>

	<textarea id="input" class="textarea" spellcheck="false">    
graph { align: left; label: CODEPEN SCHEME; color:red;}
[ CodePen ] { fill: lime; }

[ CodePen ] --> [ HTML ]
[ CodePen ] --> [ CSS ]
[ CodePen ] --> [ JavaScript ]

[ HTML ] --> [ Live Preview ]
[ CSS ] --> [ Live Preview ]
[ JavaScript ] --> [ Live Preview ]

[ Live Preview ] --> [ Learn ]
[ Live Preview ] --> [ Experiment ]
[ Live Preview ] --> [ Prototype ]

[ Learn ] --> [ Better Projects ]
[ Experiment ] --> [ Better Projects ]
[ Prototype ] --> [ Better Projects ]

[ Better Projects ] --> [ Share Pens ]
[ Better Projects ] --> [ Team Collaboration ]

[ Share Pens ] --> [ Feedback ]
[ Team Collaboration ] --> [ Feedback ]

[ Feedback ] --> [ Improve ]
[ Feedback ] --> [ Get Inspired ]

[ Improve ] --> [ New Ideas ]
[ Get Inspired ] --> [ New Ideas ]

[ New Ideas ] --> [ CodePen ]
  </textarea>

    
	<pre class="output" id="ts-output"></pre>

	<script type="module" crossorigin src="graph.min.js"></script>

	<script>
		const input = document.getElementById('input');
		const output = document.getElementById('ts-output');
		const outputf = document.getElementById('output-format');
		const examples = document.getElementById("examples");

		const samples = { "join": "[ Bonn ], [ Aachen ] --> 1 --> [ Berlin]", "split": "[ Bonn ] --> 1 --> [ Berlin ], [ Aachen ]", "comma": "[ Potsdam ], [ Mannheim ] --> { end: back,0; }\n[ Weimar ] --> { start: front,0; } [ Finsterwalde ], [ Aachen ]", "mixed chains": "[ A ] { size: 2,2; }\n-> [ B ] { rows: 2; }\n-> [ C ] { columns: 3; }\n[ A ] -> [ B ]\n-> [ C ]\n-> [ D ]\n[ D ] -> [ C ]\n[ B ] -> [ C ]\n[ A ] -> [ F ]\n[ A ] -> [ G ]", "record": "[ A | B | C ]", "record connect": "[ A | B | C ]\n[ 1 ] -> [ ABC.2 ]\n[ ABC.1 ] --> [ out ]", "group fill": "(German Cities[ Berlin ] -> [ Potsdam ]) { fill: red; }\n(Brazil Cities [SP] -> [Potsdam]) { fill: gray; }", "edge color": "edge { color: blue; }\nnode { color: green; }\n[ alamo ] -> [ se ]", "graph label": "graph { align: left; label: My Graph; }\nnode { align: left; }\n( Nodes:\n[ Right\\nAligned ] { align: right; }\n-- label\\n text --> { align: left; }\n[ Left\\naligned ]\n)", "color and fills": "[ Crimson ] { shape: circle; background: crimson; } -- Aqua Marine --> { background: #7fffd4; }\n[ Misty Rose ] { background: white; fill: rgb(255,228,221); shape: ellipse; }", "border": "[ Normal ] --> [ Bold ] { border: bold; } --> [ Broad ] { border: broad; } --> [ Wide ] { border: wide; } --> [ Bold-Dash ] { border: bold-dash; }", "border color": "node { border: black bold; }\n[ Black ] --> [ Red ] { bordercolor: red; } --> [ Green ] { bordercolor: green; }", "border style": "[ Dotted ] { border: dotted; } --> [ Dashed ] { border: dashed; } --> [ Broad ] { border: broad; }", "label color": "[ Lime ] { color: limegreen; } -- label --> { color: blue; labelcolor: red; }\n[ Dark Orange ] { color: rgb(255,100,10); }", "colorscheme": "[ 1 ] { fill: 1; } -> [ 3 ] { fill: 3; } -> [ 4 ] { fill: 4; } -> [ 5 ] { fill: 5; } -> [ 6 ] { fill: 6; } -> [ 7 ] { fill: 7; } -> [ 8 ] { fill: 8; }", "minlen and origin": "[ Bonn ] -- longer --> { minlen: 3; } [ Berlin ]\n[ Bonn ] --> [ Potsdam ] { origin: Bonn; offset: 2,2; }", "north ports": "[ Bonn ] -- NORTH --> { start: north; end: north; } [ Berlin ]", "polygon": "[ A ] -> [ B ] { shape: ellipse; } -> [ C ] { shape: diamond; } -> [ D ] { shape: square; } -> [ E ] { shape: circle; } -> [ F ] { shape: triangle; } -> [ G ] { shape: star; } -> [ H ] { shape: none; }" };


		Object.keys(samples).forEach(name => {
			const option = document.createElement("option");
			option.value = name;
			option.textContent = name;
			examples.appendChild(option);
		});

		async function init() {
			while (!window.graphE) {
				await new Promise(r => setTimeout(r, 50));
			}
			graphE.run(input.value, "graphviz").then((response) => {
				output.innerHTML = response;
			}).catch(err => {
				console.error("ERRO:", err);
			});
		}

		init();


		input.addEventListener("input", () => {
			graphE.run(input.value, outputf.value).then((response) => {
				output.innerHTML = response;
			}).catch(err => {
				console.error("ERRO:", err);
			});
		});

		outputf.addEventListener("change", () => {
			graphE.run(input.value, outputf.value).then((response) => {
				output.innerHTML = response;
			}).catch(err => {
				console.error("ERRO:", err);
			});
		});

		examples.addEventListener("change", () => {
			input.value = samples[examples.value];
			graphE.run(input.value, outputf.value)
				.then(response => {
					output.innerHTML = response;
				})
				.catch(err => {
					console.error("ERRO:", err);
				});
		});


	</script>
</body>

</html>
