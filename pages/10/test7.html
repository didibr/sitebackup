        async function paintTest(
    text,
    options = {}
) {

    const {
        align = "center",
        color = "#FFFFFF",
        size = 180,
        width = "center",
        height = "center"
    } = options;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = shader.state.canvas.width
    canvas.height = shader.state.canvas.height

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "#000";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = color;
    ctx.font = `bold ${size}px Arial`;
    ctx.textAlign = align;
    ctx.textBaseline = "middle";

    const lines = String(text).split("\n");

    const lineHeight = size * 1.2;
    const totalHeight = lines.length * lineHeight;

    let x;
    let y;

    switch (width) {

        case "left":
            x = size * 0.5;
            ctx.textAlign = "left";
            break;

        case "right":
            x = canvas.width - size * 0.5;
            ctx.textAlign = "right";
            break;

        default:
            x = canvas.width * 0.5;
            ctx.textAlign = "center";
            break;
    }

    switch (height) {

        case "top":
            y = size * 0.7;
            break;

        case "bottom":
            y =
                canvas.height -
                totalHeight;
            break;

        default:
            y =
                canvas.height * 0.5 -
                totalHeight * 0.5 +
                lineHeight * 0.5;
            break;
    }

    for (let i = 0; i < lines.length; i++) {

        ctx.fillText(
            lines[i],
            x,
            y + i * lineHeight
        );
    }

    await shader.uniform(
        "iChannel7",
        canvas
    );

    await shader.uniform(
        "uFrameupdate",
        shader.state.frameCount,
        "int"
    );
}

async function paintImage(
    source,
    options = {}
) {

    const {
        width = "center",
        height = "center",
        size = 1
    } = options;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width  = shader.state.canvas.width;
    canvas.height = shader.state.canvas.height;

    ctx.fillStyle = "#000";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    let img;

    if (typeof source === "string") {

        img = new Image();
        img.crossOrigin = "anonymous";

        await new Promise((resolve, reject) => {

            img.onload = resolve;
            img.onerror = reject;
            img.src = source;

        });

    } else {

        img = source;

    }

    const w = img.width * size;
    const h = img.height * size;

    let x = 0;
    let y = 0;

    switch (width) {

        case "left":
            x = 0;
            break;

        case "right":
            x = canvas.width - w;
            break;

        default:
            x = (canvas.width - w) * 0.5;
            break;

    }

    switch (height) {

        case "top":
            y = 0;
            break;

        case "bottom":
            y = canvas.height - h;
            break;

        default:
            y = (canvas.height - h) * 0.5;
            break;

    }

    ctx.drawImage(
        img,
        x,
        y,
        w,
        h
    );

    await shader.uniform(
        "iChannel7",
        canvas
    );

    await shader.uniform(
        "uFrameupdate",
        shader.state.frameCount,
        "int"
    );
}

        window.FF=shader;
        window.YY=paintTest;
        window.XX=paintImage;
    </script>
