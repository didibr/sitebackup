<body>

  <script type="module">
    //https://www.shadertoy.com/view/ssByDV
    //https://www.shadertoy.com/view/Wtj3Wm
    import { ShaderPlay } from "https://didisoftwares.ddns.net/10/shaderplay6.js";
    const shader = ShaderPlay.create();
    //window.SS = shader;

    shader.setResolution(300, 300);



    const aa0 = `
#version 300 es
//Common
vec4 Saturate(vec4 pixel, float adjustment) {
    vec3 intensity = vec3(dot(pixel.rgb, vec3(0.2126, 0.7152, 0.0722)));
    return vec4(mix(intensity, pixel.rgb, adjustment), 1.0);
}
float GoldNoise(in vec2 xy, in float seed) {
    xy += 1.0; seed += 1000.0;
    return fract(tan(distance(xy * 1.61803398874989484820459, xy) * seed) * xy.x);
}
float GetColumnWidth(const in float x, const in float layer, const in vec2 minMaxColumnWidth) {
    return mix(minMaxColumnWidth.x, minMaxColumnWidth.y, GoldNoise(vec2(layer, layer), x));
}
float GetRowHeight(const in float y,const float layer,const in vec2 minMaxRowHeight) {
    return mix(minMaxRowHeight.x, minMaxRowHeight.y, GoldNoise(vec2(layer, layer), y + 99.0));
}
vec3 GetColumnByUV(const in vec2 uv, const in float layer,const in vec2 minMaxColumnWidth) {
    float column = 0.0;
    float widthSum = 0.0;
    for (int i = 0; i < 256; i++) {
        float colWidth = GetColumnWidth(column, layer, minMaxColumnWidth);
        if (uv.x >= widthSum && uv.x < widthSum + colWidth) return vec3(widthSum, widthSum + colWidth, column);
        widthSum += colWidth;
        column++;
    }
    return vec3(0.0);
}
vec3 GetRowByUV(const in vec2 uv,
    const in float layer,
    const in vec2 minMaxRowHeight) {
    float row = 0.0;
    float heightSum = 0.0;
    for (int i = 0; i < 256; i++) {
        float rowHeight = GetRowHeight(row, layer, minMaxRowHeight);
        if (uv.y >= heightSum && uv.y < heightSum + rowHeight) return vec3(heightSum, heightSum + rowHeight, row);
        heightSum += rowHeight;
        row++;
    }
    return vec3(0.0);
}
vec4 GetRect(const in vec2 uv, const in float layer,const in vec2 minMaxColumnWidth,
    const in vec2 minMaxRowHeight) {
    vec3 columnInfo = GetColumnByUV(uv, layer, minMaxColumnWidth);
    vec3 rowInfo = GetRowByUV(uv, layer, minMaxRowHeight);
    return vec4(columnInfo.x, columnInfo.y, rowInfo.x, rowInfo.y);
}
vec4 RenderSquares(const in vec2 uv, const in float startLayerIndex, const in float endLayerIndex,
    const in vec2 minMaxColumnWidth,const in vec2 minMaxRowHeight,const in float maxHorizontalOffset) {
    float lum = 0.0;
    for (float i = startLayerIndex; i < endLayerIndex; i++) {
        vec4 rect = GetRect(uv, i, minMaxColumnWidth, minMaxRowHeight);
        bool renderRect = GoldNoise(vec2(rect.x, rect.z), i) > 0.95;
        if (renderRect) {
            float offsetSign = GoldNoise(vec2(rect.x, rect.z), rect.x * rect.x) > 0.5 ? 1.0 : -1.0;
            float offset = GoldNoise(vec2(rect.x, rect.z), rect.x * rect.z) * maxHorizontalOffset * offsetSign;
            lum = uv.x + offset;
            break;
        } else {
            lum = uv.x;
        }
    }
    return vec4(lum, lum, lum, 1.0);
}

//iChannel2
uniform int swap;
uniform float startTime;
uniform int transitionType;
uniform float duration;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
}

float getProgress() {
    float t = iTime - (startTime * 0.001);
    float p = clamp(t / duration, 0.0, 1.0);
    return p * p * (3.0 - 2.0 * p);
}

// ================= BUFFER =================
void mainImage(out vec4 fragColor, in vec2 fragCoord) {
    vec2 uv = fragCoord.xy / iResolution.xy;
    vec3 target = (swap == 0) ? texture(iChannel0, uv).rgb : texture(iChannel1, uv).rgb;
    vec3 current = (swap == 0) ? texture(iChannel1, uv).rgb : texture(iChannel0, uv).rgb;
    float progress = getProgress();
    vec3 col;
    // ================= TRANSITION TYPES =================
    // default
    if (transitionType == 0) {
        col = target;
    }

    //1 - cyberpunk
    else if (transitionType == 1) {
        float t = mix(-0.25, 1.25, progress);
        vec4 mask = RenderSquares( uv, 0.0, 20.0,
            vec2(0.01, 0.2),vec2(0.01, 0.1),0.1
        );

        vec4 accentMask = RenderSquares(uv,20.0,40.0,
            vec2(0.01, 0.2),vec2(0.001, 0.1),0.1
        );
        vec4 outColor;
        if (mask.r > t) {
            outColor = vec4(current, 1.0);
            if (t > accentMask.r - 0.2) {
                outColor = Saturate(outColor, 2.0);
                outColor *= 0.4;
            }
        } else {
            outColor = vec4(target, 1.0);
        }
        col = outColor.rgb;
    }

    // 2 - drop water
    else if (transitionType == 2) {
        if (progress >= 0.999) {
            col = target;
        } else {
            float freq = 8.0; float fade = 4.0;
            float displacement = 0.2;
            vec2 R = iResolution.xy;
            vec2 U = ((2.0 * fragCoord.xy) - R) / min(R.x, R.y);
            float D = length(U);
            float pixel_time = max(0.0, (progress * fade) - D);
            float wave_height = (cos(pixel_time * freq) + 1.0) * 0.5;
            float wave_scale = (1.0 - min(1.0, pixel_time / fade));
            float frac = wave_height * wave_scale;
            vec2 dir = (D > 0.0001) ? (U / D) : vec2(0.0);
            vec2 tc = uv + dir * (-((sin(pixel_time * freq) / fade) * wave_scale) * displacement);
            vec3 a = current;
            vec3 b;
            if (swap == 0)
                b = texture(iChannel0, tc).rgb;
            else
                b = texture(iChannel1, tc).rgb;
            col = mix(a, b, clamp(1.0 - frac + progress, 0.0, 1.0));
        }
    }
        
    //3 - zoom blur
    else if (transitionType == 3) {
        vec2 center = vec2(0.5);
        vec2 toCenter = center - uv;
        float strength = sin(progress * 3.14159) * 0.3;
        vec3 color = vec3(0.0);
        float total = 0.0;
        for (float t = 0.0; t <= 10.0; t++) {
            float percent = t / 10.0;
            float weight = percent * (1.0 - percent);
            vec2 sampleUV = uv + toCenter * percent * strength;
            vec3 a = current;
            vec3 b = target;
            color += mix(a, b, progress) * weight;
            total += weight;
        }
        col = color / total;
    }                
    fragColor = vec4(col, 1.0);
}
// ================= FINAL =================
//Main
void mainImage(out vec4 fragColor, in vec2 fragCoord) {
    vec2 uv = fragCoord.xy / iResolution.xy;
    fragColor = texture(iChannel2, uv);
}
`


    
    const vertex2 = `in vec2 position; void main() { gl_Position = vec4(position, 0.0, 1.0);}`;

      await shader.uniform('iChannel0', 'https://didisoftwares.ddns.net/10/images/leo.png');
      await shader.uniform('iChannel1', 'https://didisoftwares.ddns.net/10/images/flor.jpg');



// inicial
shader.uniform("duration", 1.5);
shader.uniform("swap", 0,'int');
shader.uniform("transitionType", 0,'int');

}, 3000);*/

setInterval(() => { changeImage(100,100);}, 4000);

    })();

    const images=[
    "1503614472-8c93d56e92ce",
    "1528184039930-bd03972bd974",
    "1498429089284-41f8cf3ffd39",
    "1465189684280-6a8fa9b19a7a",
    "1433838552652-f9a46b332c40",
    "1523712999610-f77fbcfc3843",
    "1773176647951-d8f618dee942",
    "1506744038136-46273834b3fb",
    "1580917388462-2e09d69dff51",
    "1470252649378-9c29740c9fa8"]

let current = 0; // visible
let next = 1;    // next visible
let index = 1;
let swap = 1;

async function changeImage(w,h) {  
  const usplash = "https://images.unsplash.com/photo-";
  // transition
  console.log(current,swap);
  shader.uniform("swap", swap, "int");
  shader.uniform("transitionType", 3, "int");
  shader.uniform("startTime", performance.now());
  // next image  
  index = (index + 1) % images.length;
  const url = `${usplash}${images[index]}?auto=format&fit=crop&w=${w}&h=${h}`;    
  //change not visible buffer
  shader.uniform(`iChannel${next}`, url);  
  setTimeout(() => {
    current = next;
    next = 1 - next;
    swap = 1 - swap;
  }, 1500); // igual duration
}


  </script>
