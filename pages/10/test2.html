<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: radial-gradient(circle at 20% 20%, #0f172a 0%, #05070d 40%, #000 100%);
            overflow: hidden;
        }

        /* GRID futurista */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.25;
            pointer-events: none;
            transform: perspective(500px) rotateX(60deg) scale(2);
            transform-origin: center;
        }

        /* brilho ambiente */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 30% 30%, rgba(0, 255, 255, 0.12), transparent 40%),
                radial-gradient(circle at 70% 60%, rgba(255, 0, 200, 0.08), transparent 45%);
            pointer-events: none;
            mix-blend-mode: screen;
            filter: blur(40px);
        }

        .ui {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
        }

        .panel {
            background: rgba(50, 50, 50, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 10px;
            color: #e4d50e;
            text-align: center;
            z-index: 999;
        }

        #game {
            width: min(95vw, 900px,
                    calc(100vh * 2));
            aspect-ratio: 6 / 3;
            margin: 0 auto;
        }

        #levelText {
            color: lime;
        }

        #startBtn {
            position: relative;
            padding: 10px 22px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #fff;
            cursor: pointer;
            overflow: hidden;
            background:
                linear-gradient(45deg,
                    #ff4d4d, #ff8a00);
            transition:
                transform 0.15s ease,
                box-shadow 0.2s ease;
        }

        #startBtn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg,
                    transparent,
                    rgba(255, 255, 255, 0.5),
                    transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        /* hover */
        #startBtn:hover {
            transform:
                translateY(-2px) scale(1.03);
            box-shadow: 0 0 15px rgba(255, 100, 0, 0.7);
        }

        #startBtn:hover::before {
            transform: translateX(100%);
        }

        #startBtn:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px rgba(255, 100, 0, 0.5);
        }

        #tempo,
        #memorize {
            display: none;
        }

        @media (max-height: 400px) {
            body {
                justify-content: center;
                align-items: center;
            }

            /* container geral vira linha */
            body {
                flex-direction: row;
                gap: 0;
            }

            #game {
                margin: 0;
            }

            .ui {
                position: relative;
                top: auto;
                left: auto;
                right: auto;

                margin-right: 8px;
                /* quase encostado no canvas */
                display: flex;
                align-items: center;
            }

            .panel {
                position: relative;
            }
        }
    </style>
</head>

<body>

    <div class="ui">
        <div class="panel">
            <div id="levelText">Stage 1</div>
            <button id="startBtn">START</button><br>
            <div id="tempo">
                Elapsed: <span id="time">0</span>s |
                Erros: <span id="errors">0</span>
            </div>
            <div id="memorize">
                Memorize the cards
            </div>
        </div>
    </div>

    <div id="game"></div>

    <script type="module">
        import { ShaderPlay } from "https://didisoftwares.ddns.net/10/shaderplay2.js";
        const shader = ShaderPlay.create();


        const COLS = 6;
        const ROWS = 2;
        const TOTAL = COLS * ROWS;
        let cardMap = [];
        let revealed = new Array(TOTAL).fill(0);
        let matched = new Array(TOTAL).fill(0);
        let flipped = [];
        let lock = true;
        let errors = 0;
        let level = 1;
        let startTime, timer;
        const previewTimes = [6000, 5000, 4000, 100];

        // card pairs
        function generatePairs() {
            let arr = [];
            for (let i = 0; i < TOTAL / 2; i++) arr.push(i, i);
            return arr.sort(() => Math.random() - 0.5);
        }

        //ichannels
        const ichhanels = [
            `// greem ripple
    void mainImage(out vec4 o,in vec2 fc){
        vec2 uv = fc / iResolution.xy;
        float wave = sin(uv.x*20.0 + iTime*2.0) * 0.1;
        uv.y += wave;
        float c = smoothstep(0.4,0.6,uv.y);
        vec3 col = vec3(0.1, c, 0.1);
        o = vec4(col,1.0);
    }`,

            `// blue water
    void mainImage(out vec4 o,in vec2 fc){
        vec2 uv = fc / iResolution.xy;
        float ripple = sin(length(uv-0.5)*20.0 - iTime*3.0);
        float c = ripple*0.5 + 0.5;
        vec3 col = vec3(0.1,0.2,c);
        o = vec4(col,1.0);
    }`,

            `// yellow stripes
    void mainImage(out vec4 o,in vec2 fc){
        vec2 uv = fc / iResolution.xy;
        float stripes = step(0.5, fract(uv.x*10.0 + iTime));
        vec3 col = mix(vec3(0.6,0.6,0.1), vec3(1.0,1.0,0.2), stripes);
        o = vec4(col,1.0);
    }`,

            `// pink smoke
    void mainImage(out vec4 o,in vec2 fc){
        vec2 uv = fc / iResolution.xy;
        float t = iTime * 0.6;
        float n = sin(uv.x*6.0 + t);
        n += sin(uv.y*7.0 - t*1.2);
        n += sin((uv.x+uv.y)*5.0 + t*0.8);
        n = n / 3.0;
        n = n * 0.5 + 0.5;
        vec3 col = vec3(0.6*n, 0.2*n, n);
        o = vec4(col,1.0);
    }`,

            `// cyan dots
    void mainImage(out vec4 o,in vec2 fc){
        vec2 uv = fc / iResolution.xy;
        vec2 gv = fract(uv*10.0) - 0.5;
        float d = length(gv);
        float dots = smoothstep(0.25,0.2,d);
        vec3 col = vec3(0.1, dots, dots);
        o = vec4(col,1.0);
    }`,

            `// red smoke
    void mainImage(out vec4 o,in vec2 fc){
        vec2 uv = fc / iResolution.xy;
        float n = sin(uv.x*10.0 + iTime) * sin(uv.y*10.0 + iTime*0.5);
        n += sin((uv.x+uv.y)*8.0 - iTime);
        n = n * 0.5 + 0.5;
        vec3 col = vec3(n, n*0.2, n*0.2);
        o = vec4(col,1.0);
    }`,
            `// purple plasma
    void mainImage(out vec4 o,in vec2 fc){
        vec2 uv = fc / iResolution.xy;
        float v = sin(uv.x*12.0 + iTime) + sin(uv.y*12.0 - iTime);
        v += sin((uv.x+uv.y)*10.0 + iTime*0.5);
        v = v / 3.0;
        v = v * 0.5 + 0.5;
        vec3 col = vec3(v*0.6, 0.2, v);
        o = vec4(col,1.0);
    }`,
            `// orange heat
    void mainImage(out vec4 o,in vec2 fc){
        vec2 uv = fc / iResolution.xy;
        float heat = sin(uv.x*8.0 + iTime*2.0) * cos(uv.y*8.0 - iTime);
        heat = heat * 0.5 + 0.5;
        vec3 col = vec3(heat, heat*0.4, 0.05);
        o = vec4(col,1.0);
    }`,
            `// black hole swirl
    void mainImage(out vec4 o,in vec2 fc){
        vec2 uv = fc / iResolution.xy - 0.5;
        float a = atan(uv.y, uv.x);
        float r = length(uv);
        float swirl = sin(10.0*r - iTime*3.0 + a*5.0);
        swirl = swirl * 0.5 + 0.5;
        vec3 col = vec3(swirl*0.2);
        o = vec4(col,1.0);
    }`,
            `// neon grid
    void mainImage(out vec4 o,in vec2 fc){
        vec2 uv = fc / iResolution.xy;
        vec2 grid = abs(fract(uv*10.0) - 0.5);
        float line = min(grid.x, grid.y);
        float glow = 1.0 - smoothstep(0.0, 0.1, line);
        vec3 col = vec3(0.0, glow, glow*0.6);
        o = vec4(col,1.0);
    }`,
            `// sunset waves
    void mainImage(out vec4 o,in vec2 fc){
        vec2 uv = fc / iResolution.xy;
        float wave = sin(uv.x*6.0 + iTime*1.5) * 0.2;
        float h = uv.y + wave;
        vec3 col = mix(
            vec3(0.9,0.3,0.1),
            vec3(0.1,0.1,0.4),
            h
        );
        o = vec4(col,1.0);
    }`,
            `// digital rain
    void mainImage(out vec4 o,in vec2 fc){
        vec2 uv = fc / iResolution.xy;
        float col = step(0.95, fract(uv.y*20.0 - iTime*5.0 + sin(uv.x*10.0)));
        vec3 color = vec3(0.0, col, 0.0);
        o = vec4(color,1.0);
    }`
        ];

        const used = new Set();
        function getRandomShader() {
            let idx;
            do {
                idx = Math.floor(Math.random() * ichhanels.length);
            } while (used.has(idx));
            used.add(idx);
            return ichhanels[idx];
        }

        // SHADER
        function createFrag() {
            used.clear();
            return `
//iChannel0 = https://didisoftwares.ddns.net/10/border.png
//iChannel1
${getRandomShader()}
//iChannel2
${getRandomShader()}
//iChannel3
${getRandomShader()}
//iChannel4
${getRandomShader()}
//iChannel5
${getRandomShader()}
//iChannel6
${getRandomShader()}

//Main
uniform float cards[12];
uniform float revealed[12];
uniform float matched[12];

float getVal(float arr[12], int i){
    if(i==0) return arr[0];
    if(i==1) return arr[1];
    if(i==2) return arr[2];
    if(i==3) return arr[3];
    if(i==4) return arr[4];
    if(i==5) return arr[5];
    if(i==6) return arr[6];
    if(i==7) return arr[7];
    if(i==8) return arr[8];
    if(i==9) return arr[9];
    if(i==10) return arr[10];
    return arr[11];
}

vec3 getCard(float id, vec2 uv){
    if(id==0.0) return texture2D(iChannel1, uv).rgb;
    if(id==1.0) return texture2D(iChannel2, uv).rgb;
    if(id==2.0) return texture2D(iChannel3, uv).rgb;
    if(id==3.0) return texture2D(iChannel4, uv).rgb;
    if(id==4.0) return texture2D(iChannel5, uv).rgb;
    return texture2D(iChannel6, uv).rgb;
}

void mainImage(out vec4 o,in vec2 fc){
    vec2 uv = fc / iResolution.xy;
    vec2 grid = vec2(6.0,2.0);
    vec2 cell = floor(uv * grid);
    vec2 local = fract(uv * grid);
    int idx = int(cell.y * 6.0 + cell.x);
    float id = getVal(cards, idx);
    float rev = getVal(revealed, idx);
    float mat = getVal(matched, idx);

    // ===== GAP =====
    float gap = 0.08;
    vec2 inner = (local - gap) / (1.0 - gap*2.0);

    // our of card
    if(inner.x < 0.0 || inner.x > 1.0 || inner.y < 0.0 || inner.y > 1.0){
        discard;
    }

    // ===== BORDER RADIUS REAL (SDF) =====
    float radius = 0.15;
    vec2 p = inner - 0.5;
    vec2 b = vec2(0.5 - radius);
    vec2 q = abs(p) - b;
    float dist = length(max(q,0.0)) + min(max(q.x,q.y),0.0) - radius;
    float mask = 1.0 - smoothstep(0.0, 0.02, dist);
    if(mask < 0.01){
        discard;
    }

    // ===== CARD =====
    vec3 col = getCard(id, inner);
    if(rev < 0.5 && mat < 0.5){
        col = vec3(0.1);
    }

    //PNG
    vec4 border = texture2D(iChannel0, inner);
    col = mix(col, border.rgb, border.a);    
    col *= mask;
    o = vec4(col,mask);
}
`};

        const vert = `
attribute vec2 position;
void main(){gl_Position = vec4(position,0,1);}
`;

        let canvas;
        let gameStarted = false;
        const delay = (ms) => new Promise(res => setTimeout(res, ms));

        async function init() {
            const frag = createFrag();
            if (!gameStarted) {
                gameStarted = true;
            } else {
                shader.destroy();
            }
            shader.setResolution(400, 400);
            canvas = await shader.Shader("game", vert, frag, { alpha: false });
            setupClick();
        }

        function update() {
            shader.uniform("cards", cardMap);
            shader.uniform("revealed", revealed);
            shader.uniform("matched", matched);
            shader.update();
        }

        // CLICK
        function setupClick() {
            canvas.addEventListener("click", (e) => {
                if (lock) return;
                const rect = canvas.getBoundingClientRect();
                const nx = (e.clientX - rect.left) / rect.width;
                const ny = (e.clientY - rect.top) / rect.height;
                const ux = nx;
                const uy = 1.0 - ny;
                const col = Math.floor(ux * COLS);
                const row = Math.floor(uy * ROWS);
                const idx = row * COLS + col;
                clickCard(idx);
            });
        }

        function clickCard(i) {
            if (lock) return;
            if (revealed[i] || matched[i]) return;
            revealed[i] = 1;
            flipped.push(i);
            update();
            if (flipped.length === 2) {
                lock = true;
                const [a, b] = flipped;
                if (cardMap[a] === cardMap[b]) {
                    matched[a] = matched[b] = 1;
                    flipped = [];
                    lock = false;
                    checkWin();
                } else {
                    errors++;
                    document.getElementById("errors").textContent = errors;
                    setTimeout(() => {
                        revealed[a] = 0;
                        revealed[b] = 0;
                        flipped = [];
                        lock = false;
                        update();
                    }, 600);
                }
            }
        }

        async function nextLevel() {
            level++;
            if (level > 4) {
                clearInterval(timer);
                alert("Congratulations! You completed all the stages!");
                return;
            }
            document.getElementById("levelText").textContent = "Stage " + level;
            revealed.fill(0);
            matched.fill(0);
            flipped = [];
            cardMap = generatePairs();
            update();

            await init(); //random new channels

            await delay(800);
            await startPreview();
        }

        function startPreview() {
            document.getElementById('memorize').style.display = "block";
            document.getElementById('tempo').style.display = "none";
            lock = true;
            revealed.fill(1);
            update();
            setTimeout(() => {
                document.getElementById('memorize').style.display = "none";
                document.getElementById('tempo').style.display = "block";
                revealed.fill(0);
                lock = false;
                update();
            }, previewTimes[level - 1]);
        }
        let elapsed = 0;
        function startTimer() {
            startTime = Date.now();
            elapsed = 0;
            clearInterval(timer);
            timer = setInterval(() => {
                if (!lock) {
                    const now = Date.now();
                    elapsed += now - startTime;
                    startTime = now;
                } else {
                    // no timer in lock
                    startTime = Date.now();
                }

                document.getElementById("time").textContent =
                    Math.floor(elapsed / 1000);

            }, 100);
        }

        // START
        function start() {
            level = 1;
            errors = 0;
            flipped = [];
            document.getElementById('startBtn').remove();
            document.getElementById("levelText").textContent = "Stage 1";
            document.getElementById("errors").textContent = 0;
            document.getElementById("time").textContent = 0;
            revealed.fill(0);
            matched.fill(0);
            cardMap = generatePairs();
            update();
            startTimer();
            startPreview();
        }

        function checkWin() {
            if (matched.every(v => v === 1)) {
                nextLevel();
            }
        }

        document.getElementById("startBtn").onclick = start;


        init();




    </script>
</body>

</html>
