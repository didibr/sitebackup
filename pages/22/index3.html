<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>Dance</title>
  <link rel="stylesheet" href="player.css" />
</head>

<body>


  <div id="audioUnlock" class="unlock-overlay">
    <div class="unlock-box glass3d">
      <div class="unlock-title">🔊 Activate Audio</div>
      <button id="unlockBtn" class="btn btn-primary w-100">Click to Start</button>
    </div>
  </div>

  <div class="main">

    <div class="layout">

      <!-- PLAYER -->
      <div id="pContainer" class="player-container">
        <!-- RECEIVING CANVAS -->
      </div>

      <!-- CONTROLES -->
      <div class="controls-bar">
        <button id="playBtn" onclick="fncPlay()">
          <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
          </svg>
        </button>

        <button id="stopBtn" onclick="fncStop()">
          <svg viewBox="0 0 24 24">
            <rect x="6" y="6" width="12" height="12" />
          </svg>
        </button>

        <button id="nextBtn" onclick="fncNext()">
          <svg viewBox="0 0 24 24">
            <path d="M5 5v14l8-7z" /> <!-- primeiro triângulo -->
            <path d="M13 5v14l8-7z" /> <!-- segundo triângulo -->
            <rect x="21" y="5" width="2" height="14" /> <!-- barra -->
          </svg>
        </button>
      </div>

      <!-- PLAYLIST -->
      <div class="playlist-panel glass3d">
        <div class="select-wrapper mb-2">
          <select id="playlistSelect" class="form-select" onchange="changePlaylist(this.value)"></select>
        </div>
        <div id="playlist" class="playlist"></div>
      </div>

    </div>

  </div>

  <audio id="player"></audio>


  <script type="module">
    import { ShaderPlay } from "https://didisoftwares.ddns.net/10/shaderplay.js";
    const shader = ShaderPlay.create();

    const test = `#version 300 es
    //iChannel0
    const vec3 c = vec3(1.0, 0.0, -1.0);
    float iScale;

    void rand(in vec2 x, out float n)
    {
        x += 400.;
        n = fract(sin(dot(sign(x)*abs(x) ,vec2(12.9898,78.233)))*43758.5453);
    }

    float audioBand(float b)
    {
        return texture2D(iAudio0, vec2(b*0.66,0.0)).r;
    }

    // Box sdf
    void dbox(in vec2 x, in vec2 b, out float d)
    {
        vec2 da = abs(x)-b;
        d = length(max(da,c.yy)) + min(max(da.x,da.y),0.0);
    }

    // Stroke
    void stroke(in float d0, in float s, out float d)
    {
        d = abs(d0)-s;
    }

    // Extrusion
    void zextrude(in float z, in float d2d, in float h, out float d)
    {
        vec2 w = vec2(-d2d, abs(z)-0.5*h);
        d = length(max(w,0.0));
    }

    // Add sdfs
    void add(in vec2 sda, in vec2 sdb, out vec2 sdf)
    {
        sdf = sda.x<sdb.x?sda:sdb;
    }

    vec2 ind;
    void scene(in vec3 x, out vec2 sdf)
    {
        x.y += .3*iTime;
        x.xy = vec2(x.x-x.y,x.x+x.y)/sqrt(2.);
        
        float d,
            size = .1;
        vec2 x2 = mod(x.xy,size)-.5*size;
      
        ind = ceil((x.xy - x2)/size);
        dbox(x2, .5*size*c.xx, d);
        zextrude(x.z, -d-.005, .05, d);
        d = max(x.z,d);
        d = abs(d);
        sdf = vec2(d,2.);
        
        float r, r2;
        rand(ind-floor(iTime), r);
        rand(ind-floor(iTime)-1., r2);
        r = mix(r, r2, smoothstep(.8,1.,fract(iTime)));
        if(r > .7)
        {
            r2 = 1.;
            dbox(x2, .5*size*c.xx, d);
            //zextrude(x.z, -d-.02, .3*(r-.7)/.3*r2, d);

    float band = fract( sin(dot(ind, vec2(17.1,91.7))) * 43758.5453);

    float audio =
    texture2D(iAudio0, vec2(band * 0.66, 0.0)).r;

    audio = pow(audio, 1.5);

    float h = 0.05 + audio * 1.0;

    zextrude(x.z, -d-.02, h, d);


            stroke(d, .001, d);
            add(sdf, vec2(d,1.), sdf);
        }
    }

    void normal(in vec3 x, out vec3 n)
    {
        const float dx = 1.e-4;
        vec2 s, na;
        
        scene(x,s);
        scene(x+dx*c.xyy, na);
        n.x = na.x;
        scene(x+dx*c.yxy, na);
        n.y = na.x;
        scene(x+dx*c.yyx, na);
        n.z = na.x;
        n = normalize(n-s.x);
    }

    float sm(float d)
    {
        return smoothstep(1.5/iResolution.y, -1.5/iResolution.y, d);
    }

    void colorize(in vec2 x, out vec3 col)
    {
        x.y += .3*iTime;
        x = vec2(x.x-x.y,x.x+x.y)/sqrt(2.);
        
        float d,
            size = .1,
            r;
        vec2 x2 = mod(x.xy,size)-.5*size;
        
        float r2;
        rand(ind-floor(iTime), r);
        rand(ind-floor(iTime)-1., r2);
        r = mix(r, r2, smoothstep(.8,1.,fract(iTime)));
        col = mix(.14*c.xxx, .33*c.xxx, r);
        dbox(x2, .35*size*c.xx, d);
        if(r > .9)
        {
            col = mix(col, mix(c.xxy, c.xxx, .8), sm(d));
            stroke(d, .0025, d);
            col = mix(col, mix(c.xyy,c.xxx,.8), sm(d));
            stroke(d-.004, .002, d);
            col = mix(col, c.xyy, sm(d));
        }
      else if(r > .8)
        {
            col = mix(col, mix(c.xyy, c.xxx, .8), sm(d));
            stroke(d, .0025, d);
            col = mix(col, mix(.7*c.xxy,c.xxx,.8), sm(d));
            stroke(d-.004, .002, d);
            col = mix(col, .7*c.xxy, sm(d));
        }
        else if(r > .7)
        {
            col = mix(col, mix(c.xyy, c.xxx, .8), sm(d));
            stroke(d, .0025, d);
            col = mix(col, mix(mix(c.xxy, c.xyy, .5),c.xxx,.8), sm(d));
            stroke(d-.004, .002, d);
            col = mix(col, mix(c.xxy, c.xyy, .5), sm(d));
        }
    }

    void mainImage( out vec4 fragColor, in vec2 fragCoord )
    {
        iScale = 1.;
        
        vec2 uv = ( fragCoord -.5* iResolution.xy) / iResolution.y, 
            s;
        vec3 col = c.yyy, 
            o = c.yzx,
            r = c.xyy, 
            u = normalize(c.yxx), 
            t = c.yyy, 
            dir,
            n,
            x;
        int N = 100,
            i;
        t = uv.x * r + uv.y * u;
        dir = normalize(t-o);

        float d = -(o.z-.15)/dir.z;
        
        for(i = 0; i<N; ++i)
        {
          x = o + d * dir;
            scene(x,s);
            if(s.x < 1.e-4)break;
            if(x.z<-.05)
            {
                col = .2*c.xxx;
                i = N;
                break;
            }
            d += min(s.x,5.e-3);
            //d += s.x;
        }
        
        if(i < N)
        {
            normal(x,n);
            
            if(s.y == 1.)
            {
                vec3 l = normalize(x+c.xzx);
                vec3 c1;
                
                float r;
            rand(ind-floor(iTime), r);
                if(r > .9)
                    col = c.xyy;
                else if(r > .8)
                    col = .7*c.xxy;
                else if(r > .7)
                    col = mix(c.xxy, c.xyy, .5);
                float sc = clamp((r-.7)/.3,0.,1.);
                col = mix(mix(col, c.xxx, .1*sc), .4*c.xyy, sc);
                col = .3*col
                    + .9*col * abs(dot(l,n))
                    + 1.3*col * pow(abs(dot(reflect(-l,n),dir)),3.);
                col = mix(col, c.xxx, .4);
                col *= col;
                
                d = -(o.z)/dir.z;
                x = o + d * dir;
                scene(x,s);
                l = normalize(x+c.xzx);
                colorize(x.xy, c1);
                n = c.yyx;
                
                c1 = .1*c1
                    + .8*c1 * abs(dot(l,n))
                    + c1 * pow(abs(dot(reflect(-l,n),dir)),3.);
                col = mix(col, c1, .3);
            }
            else if(s.y == 2.)
            {
                vec3 l = normalize(x+c.xzx);
                float r;
                
                colorize(x.xy, col);
                col = .1*col
                    + .8*col * abs(dot(l,n))
                    + col * pow(abs(dot(reflect(-l,n),dir)),3.);
            }
        }
        col += col;
        col *= col;
        
        fragColor = vec4(clamp(col,0.,1.),1.0);
    }	

    //Main
    const float fsaa = 144.;
    void mainImage( out vec4 fragColor, in vec2 fragCoord )
    {
        vec3 col = vec3(0.);
        float bound = sqrt(fsaa)-1.;
        for(float i = -.5*bound; i<=.5*bound; i+=1.)
            for(float j=-.5*bound; j<=.5*bound; j+=1.)
            {
            col += texture(iChannel0, fragCoord/iResolution.xy+vec2(i,j)*mix(3.,20.,2.*abs(fragCoord.y/iResolution.y-.5))*exp(-abs(1.e-2*length(fragCoord.xy)/iResolution.y-.5))/max(bound, 1.)/iResolution.xy).xyz;
            }
        col /= fsaa;
        fragColor = vec4(col,1.0);
    }
    `;

    window.CreateAudioFFT = function (source, audioCtx) {
      shader.createAudioFFT(source, audioCtx, 0);
    }

    const pContainer=document.getElementById('pContainer');
    shader.setResolution(650, 360);
    await shader.Shader('pContainer',
      `in vec2 position;void main() {gl_Position = vec4(position, 0.0, 1.0);}`,
      test,
      { frameSkip: 0, alpha: false }
    );

    //pContainer
  </script>


  <script type="text/javascript" src="player.js"></script>
</body>

</html>
