<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>Dance</title>
  <link rel="stylesheet" href="player.css" />
</head>

<body>


  <div id="audioUnlock" class="unlock-overlay">
    <div class="unlock-box glass3d">
      <div class="unlock-title">🔊 Activate Audio</div>
      <button id="unlockBtn" class="btn btn-primary w-100">Click to Start</button>
    </div>
  </div>

  <div class="main">

    <div class="layout">

      <!-- PLAYER -->
      <div id="pContainer" class="player-container">
        <!-- RECEIVING CANVAS -->
      </div>

      <!-- CONTROLES -->
      <div class="controls-bar">
        <button id="playBtn" onclick="fncPlay()">
          <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
          </svg>
        </button>

        <button id="stopBtn" onclick="fncStop()">
          <svg viewBox="0 0 24 24">
            <rect x="6" y="6" width="12" height="12" />
          </svg>
        </button>

        <button id="nextBtn" onclick="fncNext()">
          <svg viewBox="0 0 24 24">
            <path d="M5 5v14l8-7z" /> <!-- primeiro triângulo -->
            <path d="M13 5v14l8-7z" /> <!-- segundo triângulo -->
            <rect x="21" y="5" width="2" height="14" /> <!-- barra -->
          </svg>
        </button>
      </div>

      <!-- PLAYLIST -->
      <div class="playlist-panel glass3d">
        <div class="select-wrapper mb-2">
          <select id="playlistSelect" class="form-select" onchange="changePlaylist(this.value)"></select>
        </div>
        <div id="playlist" class="playlist"></div>
      </div>

    </div>

  </div>

  <audio id="player"></audio>


  <script type="module">
    import { ShaderPlay } from "https://didisoftwares.ddns.net/10/shaderplay.js";
    const shader = ShaderPlay.create();

    window.SS=shader;

    

    const test = `
    #version 300 es
    //Common
    const int nbBall = 7;
float sampleBand(float begin, float end)
{
    float sum = 0.0;

    for(int i=0;i<16;i++)
    {
        float t = mix(begin,end,float(i)/15.0);
        sum += texture(iAudio0, vec2(t,0.5)).r;
    }

    return sum / 16.0;
}

//iChannel0
void mainImage(out vec4 fragColor,in vec2 fragCoord)
{
    int id = int(
    floor(
        fragCoord.x * float(nbBall) / iResolution.x
    )
);

id = clamp(id, 0, nbBall - 1);

    

    float x = (float(id)+0.5)/float(nbBall);

    vec4 prev =
    texture(
        iChannel0,
        vec2(x,0.5)
    );

    float pos  = prev.r;
    float vel  = prev.g;
    float peak = prev.b;
    float rmsPrev = prev.a;

    float bandSize = 0.7 / float(nbBall);

    float begin = float(id) * bandSize;
    float end   = begin + bandSize;

    float rms =
    sampleBand(begin,end);

    peak = max(
        peak * 0.999,
        rms
    );

    float beat = rms / max(peak,0.0001);

    float attack = max(0.0,rms-rmsPrev);

    //--------------------------------
    // física
    //--------------------------------

    float dt = max(iTimeDelta,0.016);

    // gravidade
    vel -= 3.0 * dt;

    // energia musical
    float gravity =
3.0 +
beat * 6.0;

vel -= gravity * dt;

    // movimento
    pos += vel * dt;

    // chão

    if(pos < 0.0)
    {
        pos = 0.0;

        vel =
        max(
            0.6,
            beat * 4.0
        );
    }

    // limite superior

    pos = min(pos,1.0);

    fragColor =
    vec4(
        pos,
        vel,
        peak,
        rms
    );
}

//Main
// Created by David Gallardo - xjorma/2020
// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0

const float ballRadius = 0.07;
const float maxLateralSpeed = 1.;
const float Tau = radians(360.);
const float minPhaseSpeed = 2.1;
const float maxPhaseSpeed = 3.2;
const float sinAmplitude = 1.2;
const vec3 drawColor = vec3(1.0);

// Hash without Sine, https://www.shadertoy.com/view/4djSRW
float hash11(float p)
{
    p = fract(p * .1031);
    p *= p + 33.33;
    p *= p + p;
    return fract(p);
}

float sdCircle( vec2 p, float r )
{
    return length(p) - r;
}

float udSegment( in vec2 p, in vec2 a, in vec2 b )
{
    vec2 ba = b-a;
    vec2 pa = p-a;
    float h =clamp( dot(pa,ba)/dot(ba,ba), 0.0, 1.0 );
    return length(pa-h*ba);
}

float triangleSignal(float x, float f)
{
    f = 1. / f;
    return (abs((f * x - 4. * floor(0.25 * f * x)) - 2.) - 1.) / f;
}

float smoothFilter(float d)
{
    float v = 2. / iResolution.y;
    return smoothstep(v, -v, d);
}

void mainImage( out vec4 fragColor, in vec2 fragCoord )
{
	vec2	p = (2. * fragCoord - iResolution.xy) / iResolution.y;
    float	ratio = iResolution.x / iResolution.y;
    vec3	col = vec3(0);
    
    // Compute and draw balls
    vec2	ballArray[nbBall + 1];
    for(int i = 0; i < nbBall; ++i)
    {
        float LateralSpeed = (hash11(float(i) * 1.2544) - 0.5) * 2. * maxLateralSpeed;
        float phaseOffset = hash11(float(i) * 1.4482) * Tau;
        float LateralOffset = hash11(float(i) * 1.9528) * (ratio * 2. - 2. * ballRadius);
        float phaseSpeed = mix(minPhaseSpeed, maxPhaseSpeed, hash11(float(i) * 1.1273));
        //old
        // ballArray[i] = vec2(	triangleSignal(LateralOffset + LateralSpeed * iTime, ratio - ballRadius),
        //               			sinAmplitude * (abs(sin(phaseOffset + phaseSpeed * iTime)) - 0.5) 
        //     
        //               );

        float u = (float(i)+0.5)/float(nbBall);

vec4 state = texture( iChannel0, vec2(u,0.5) );

float y = state.r * sinAmplitude;

ballArray[i] = vec2(
    triangleSignal(
        LateralOffset +
        LateralSpeed * iTime,
        ratio - ballRadius
    ),
    y- 0.1
);

        vec2 d = p - ballArray[i];
float dist = length(d);

float a = smoothFilter(dist - ballRadius);

if(a > 0.0)
{
    vec3 normal = normalize(vec3(d, sqrt(max(0.0, ballRadius*ballRadius - dist*dist))));

    vec3 lightDir = normalize(vec3(-0.5, 0.7, 1.0));

    float diffuse = max(dot(normal, lightDir), 0.0);

    float highlight = pow(max(dot(normal, lightDir), 0.0), 64.0);

    vec3 ballColor =
        vec3(0.4) +
        vec3(0.5) * diffuse +
        vec3(1.0) * highlight;

    col = mix(col, ballColor, a);
}         
    }
    
    // Sort Ball in X (Lame bubble)
    for(int i = 0; i < nbBall - 1; ++i)
    {
	    for(int j = 0; j < nbBall - 1 - i; ++j)
        {
            if(ballArray[j].x > ballArray[j + 1].x)
            {
                vec2 tmp = ballArray[j + 1];
                ballArray[j + 1] = ballArray[j];
                ballArray[j] = tmp;
            }
        }
    }
    
   	// Find convex using an algorithm similar to gift wraping
 	ballArray[nbBall] = vec2(ratio, 0);
    int   convexSize = 0;
    vec2  convexHull[nbBall + 2];
    convexHull[convexSize++] = vec2(-ratio, 0);
    int	  SmallestIndex = 0;
    for(;;)
    {
        float SmallestDir = 1.;
        bool  found = false;
        for(int i = SmallestIndex; i < nbBall + 1; ++i)
        {
            vec2 dir = normalize(ballArray[i] - convexHull[convexSize - 1]);
            if(dir.y < SmallestDir)
            {
                
                SmallestDir = dir.y;
                SmallestIndex = i;
                found = true;
            }
        }
       	if(found)
        {
            convexHull[convexSize++] = ballArray[SmallestIndex];
        }
        else
        {
            break;
        }
    }
      
        
    // Draw hull
    for(int i = 0; i < convexSize - 1; ++i)
    {
	    float a = smoothFilter(udSegment(p, convexHull[i] - vec2(0, ballRadius), convexHull[i + 1] - vec2(0, ballRadius)) - 0.005);
        col = mix(col, drawColor, a);
          
    }

 
    // Output to screen
    fragColor = vec4(col,1.0);
}
    
    `;

    window.CreateAudioFFT = function (source, audioCtx) {
      shader.createAudioFFT(source, audioCtx, 0);
    }

    const pContainer=document.getElementById('pContainer');
    shader.setResolution(650, 360);    
    await shader.Shader('pContainer',
      `in vec2 position;void main() {gl_Position = vec4(position, 0.0, 1.0);}`,
      test,
      { frameSkip: 0, alpha: false
      }
    );
    
    //pContainer
  </script>


  <script type="text/javascript" src="player.js"></script>
</body>

</html>
